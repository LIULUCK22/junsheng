# Site settings for Academic Pages
# After creating your repository from https://github.com/academicpages/academicpages.github.io,
# copy these files into that repository.

title: "Junsheng Liu"
name: "Junsheng Liu"
description: "PhD student in Computer Science at Washington University in St. Louis"
url: "https://your-github-username.github.io"
baseurl: ""
repository: "your-github-username/your-github-username.github.io"

author:
  avatar: "profile.png"
  name: "Junsheng Liu"
  bio: "PhD student in Computer Science at Washington University in St. Louis."
  location: "St. Louis, MO"
  employer: "Washington University in St. Louis"
  email: "junsheng@wustl.edu"
  phone: "(530) 761-3243"

# Academic Pages defaults
theme: null
remote_theme: "academicpages/academicpages.github.io"
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-paginate

collections:
  publications:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
